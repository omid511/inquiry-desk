name: Release source artifact

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: mkdir -p dist && tar --exclude='./node_modules' --exclude='./.next' --exclude='./.git' --exclude='./dist' -czf "dist/inquiry-desk-source-${GITHUB_REF_NAME}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: inquiry-desk-source-${{ github.ref_name }}
          path: dist/inquiry-desk-source-${{ github.ref_name }}.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/inquiry-desk-source-${{ github.ref_name }}.tar.gz
